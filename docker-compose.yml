services:
  postgres:
    image: postgres:18-alpine
    container_name: vulpix-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vulpix"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
spring.application.name=vulpix-server

spring.config.import=optional:file:./vulpix-server/.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/vulpix
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:secret}

jwt.access-secret=${ACCESS_TOKEN_SECRET}
jwt.refresh-secret=${REFRESH_TOKEN_SECRET}
jwt.access-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:60}
jwt.refresh-ttl-days=${REFRESH_TOKEN_TTL_DAYS:60}

auth.fake-password=${FAKE_PASSWORD:secret}

spring.sql.init.mode=always

server.port=5000

logging.level.web=debug
logging.level.sk.upjs.ics=debug
plugins {
    id "java-common-conventions"
    id "application"
    id 'org.openjfx.javafxplugin'
    id 'io.freefair.lombok'
}

dependencies {
    implementation project(':vulpix-shared')
}

javafx {
    version = '21.0.5'
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainClass = 'sk.upjs.ics.Main'
}
